<header class="page-header">
    <div class="page-header__identity">
        @if (backLink) {
            <a pButton [routerLink]="backLink" text severity="secondary" icon="pi pi-arrow-left" aria-label="Torna all’elenco"></a>
        }
        <div class="page-header__copy">
            @if (kicker) {
                <span class="page-header__kicker">{{ kicker }}</span>
            }
            <div class="page-header__title-row">
                <h1>{{ title }}</h1>
                @if (dirty) {
                    <p-tag severity="warn" value="Modifiche non salvate" icon="pi pi-pencil" />
                } @else if (state) {
                    <p-tag severity="secondary" [value]="state" />
                }
            </div>
            @if (subtitle) {
                <p class="page-header__subtitle">{{ subtitle }}</p>
            }
            <div class="page-header__metadata"><ng-content select="[pageMetadata]" /></div>
        </div>
    </div>
    <div class="page-header__actions"><ng-content select="[pageActions]" /></div>
</header>
