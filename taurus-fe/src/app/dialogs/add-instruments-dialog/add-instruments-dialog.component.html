<app-dialog-shell title="Nuovo strumento" subtitle="Crea uno strumento da assegnare agli utenti." confirmLabel="Aggiungi strumento" [invalidCount]="instrument.name?.trim() ? 0 : 1" (cancel)="cancel()" (confirm)="save()">
    <div class="grid grid-cols-1 gap-4">
        <app-form-field label="Nome" forId="name" required [error]="instrument.name?.trim() ? undefined : 'Inserisci il nome dello strumento.'"><input pInputText id="name" type="text" [(ngModel)]="instrument.name" /></app-form-field>
        <app-form-field label="Descrizione" forId="description"><textarea pTextarea id="description" rows="6" class="w-full" [(ngModel)]="instrument.description"></textarea></app-form-field>
    </div>
</app-dialog-shell>
