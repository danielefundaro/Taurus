name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.modules.outputs.backend }}
      frontend: ${{ steps.modules.outputs.frontend }}
      keycloak: ${{ steps.modules.outputs.keycloak }}
      info_site: ${{ steps.modules.outputs.info_site }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Collect changed files
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BASE_SHA"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}"; then
            git ls-files > changed-files.txt
          else
            git diff --name-only "$base" "$GITHUB_SHA" > changed-files.txt
          fi
      - name: Detect affected modules
        id: modules
        run: node scripts/docs/affected-modules.mjs changed-files.txt >> "$GITHUB_OUTPUT"

  documentation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate catalog
        run: node scripts/docs/validate-feature-catalog.mjs
      - name: Test documentation tooling
        run: node --test scripts/docs/feature-catalog.test.mjs
      - name: Verify generated matrix
        run: |
          node scripts/docs/generate-feature-index.mjs
          git diff --exit-code -- docs/features.md
      - name: Collect changed files
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BASE_SHA"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}"; then
            git ls-files > changed-files.txt
          else
            git diff --name-only "$base" "$GITHUB_SHA" > changed-files.txt
          fi
      - name: Report possible documentation drift
        run: node scripts/docs/check-feature-drift.mjs --changed-files changed-files.txt

  backend:
    needs: [changes, documentation]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taurus-be
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: ./mvnw verify

  frontend:
    needs: [changes, documentation]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taurus-fe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: taurus-fe/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false --browsers=ChromeHeadless
      - run: npm run build

  keycloak:
    needs: [changes, documentation]
    if: needs.changes.outputs.keycloak == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keycloak-authenticator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: ./mvnw verify

  info-site:
    needs: [changes, documentation]
    if: needs.changes.outputs.info_site == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taurus-info
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: taurus-info/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
