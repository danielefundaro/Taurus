<p-fluid class="flex flex-col gap-4 mb-8">
    <span class="text-surface-500 dark:text-surface-400 block mb-4">Inserisci le informazioni dell'evento.</span>
    <div class="flex flex-col md:flex-row gap-4">
        <p-floatlabel class="flex w-full" variant="on">
            <label for="name">Nome *</label>
            <input pInputText id="name" type="text" [(ngModel)]="event.name" />
        </p-floatlabel>
    </div>
    <div class="flex flex-col md:flex-row gap-4">
        <p-floatlabel class="flex w-full" variant="on">
            <p-datepicker [iconDisplay]="'input'" [showIcon]="true" [showTime]="true" [hourFormat]="'24'"
                inputId="startDate" dateFormat="dd-mm-yy" class="w-full" [(ngModel)]="event.startDate" />
            <label for="startDate">Data/ora inizio *</label>
        </p-floatlabel>
        <p-floatlabel class="flex w-full" variant="on">
            <p-datepicker [iconDisplay]="'input'" [showIcon]="true" [showTime]="true" [hourFormat]="'24'"
                inputId="endDate" dateFormat="dd-mm-yy" class="w-full" [(ngModel)]="event.endDate" />
            <label for="endDate">Data/ora fine</label>
        </p-floatlabel>
    </div>
    <div class="flex flex-col md:flex-row gap-4">
        <p-floatlabel class="flex w-full" variant="on">
            <input pInputText id="location" type="text" [(ngModel)]="event.location" />
            <label for="location">Luogo</label>
        </p-floatlabel>
        <p-floatlabel class="flex w-full" variant="on">
            <p-inputnumber id="fee" [(ngModel)]="event.fee" mode="currency" currency="EUR" locale="it-IT" />
            <label for="fee">Compenso</label>
        </p-floatlabel>
    </div>
</p-fluid>

<div class="flex justify-end gap-2 mt-2">
    <p-button label="Annulla" icon="pi pi-times" [text]="true" severity="secondary" (onClick)="cancel()" />
    <p-button label="Salva" icon="pi pi-check" [outlined]="true" severity="primary" (onClick)="save()"
        [disabled]="!event.name || !event.startDate" />
</div>
