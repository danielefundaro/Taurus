# ===================================================================
# Spring Boot configuration for the "prod" profile.
#
# This configuration overrides the application.yml file.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
# ===================================================================

logging:
  level:
    ROOT: INFO
    tech.jhipster: INFO
    com.fundaro.zodiac.taurus: INFO

management:
  # In produzione resta esposto il minimo: salute per le probe, info per la versione e le metriche
  # per Prometheus. Gli endpoint che stampano ambiente, proprietà, log e thread dump restano fuori:
  # sono utili in sviluppo e in produzione raccontano configurazione e segreti a chi li raggiunge.
  # L'elenco sostituisce quello di application.yml, non lo integra.
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - prometheus
  endpoint:
    env:
      show-values: never
    configprops:
      show-values: never
  prometheus:
    metrics:
      export:
        enabled: false

spring:
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false
  # Replace by 'prod, faker' to add the faker context and have sample data loaded in production
  liquibase:
    contexts: prod
    url: ${TAURUS_DB_URL}
  # Indirizzo e credenziali arrivano dall'ambiente e non hanno un valore predefinito: senza
  # TAURUS_DB_URL, TAURUS_DB_USERNAME e TAURUS_DB_PASSWORD l'applicazione non parte, invece di
  # partire su un database locale inesistente o con una password scritta nel repository.
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    url: ${TAURUS_DB_URL}
    username: ${TAURUS_DB_USERNAME}
    password: ${TAURUS_DB_PASSWORD}
    hikari:
      poolName: Hikari
      auto-commit: false
      # Il limite va tenuto insieme a max_connections di PostgreSQL e al numero di repliche:
      # pool x repliche, più le connessioni di Keycloak, devono starci dentro.
      maximum-pool-size: ${TAURUS_DB_POOL_MAX:20}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.id.new_generator_mappings: true
      hibernate.connection.provider_disables_autocommit: true
  thymeleaf:
    cache: true

# ===================================================================
# To enable TLS in production, generate a certificate using:
# keytool -genkey -alias taurus -storetype PKCS12 -keyalg RSA -keysize 2048 -keystore keystore.p12 -validity 3650
#
# You can also use Let's Encrypt:
# See details in topic "Create a Java Keystore (.JKS) from Let's Encrypt Certificates" on https://maximilian-boehm.com/en-gb/blog
#
# Then, modify the server.ssl properties so your "server" configuration looks like:
#
# server:
#   port: 443
#   ssl:
#     key-store: classpath:config/tls/keystore.p12
#     key-store-password: password
#     key-store-type: PKCS12
#     key-alias: selfsigned
#     # The ciphers suite enforce the security by deactivating some old and deprecated SSL cipher, this list was tested against SSL Labs (https://www.ssllabs.com/ssltest/)
#     ciphers: TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA,TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA,TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256,TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384 ,TLS_DHE_RSA_WITH_AES_128_GCM_SHA256 ,TLS_DHE_RSA_WITH_AES_256_GCM_SHA384 ,TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA256,TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA384,TLS_DHE_RSA_WITH_AES_128_CBC_SHA256,TLS_DHE_RSA_WITH_AES_128_CBC_SHA,TLS_DHE_RSA_WITH_AES_256_CBC_SHA256,TLS_DHE_RSA_WITH_AES_256_CBC_SHA,TLS_RSA_WITH_AES_128_GCM_SHA256,TLS_RSA_WITH_AES_256_GCM_SHA384,TLS_RSA_WITH_AES_128_CBC_SHA256,TLS_RSA_WITH_AES_256_CBC_SHA256,TLS_RSA_WITH_AES_128_CBC_SHA,TLS_RSA_WITH_AES_256_CBC_SHA,TLS_DHE_RSA_WITH_CAMELLIA_256_CBC_SHA,TLS_RSA_WITH_CAMELLIA_256_CBC_SHA,TLS_DHE_RSA_WITH_CAMELLIA_128_CBC_SHA,TLS_RSA_WITH_CAMELLIA_128_CBC_SHA
# ===================================================================
server:
  port: 8080
  # L'applicazione sta dietro il reverse proxy che termina TLS: le intestazioni X-Forwarded-* sono
  # la sola fonte dello schema, dell'host e dell'indirizzo del chiamante.
  forward-headers-strategy: framework
  shutdown: graceful # see https://docs.spring.io/spring-boot/docs/current/reference/html/spring-boot-features.html#boot-features-graceful-shutdown
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/calendar,application/javascript,application/json,image/svg+xml
    min-response-size: 1024

# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================

jhipster:
  http:
    cache: # Used by the CachingHttpHeadersFilter
      timeToLiveInDays: 1461
  logging:
    # Una riga JSON per evento: i campi del contesto (requestId del filtro di correlazione, tenant
    # dell'interceptor) diventano campi del documento, e una raccolta automatica può filtrarli
    # senza interpretare il testo. Lo standard output resta l'unica destinazione: la raccolta e la
    # conservazione appartengono all'host, come spiega il runbook operativo.
    use-json-format: true
    logstash: # Forward logs to logstash over a socket, used by LoggingConfiguration
      enabled: false
      host: localhost
      port: 5000
      ring-buffer-size: 512
# ===================================================================
# Application specific properties
# Add your own application properties here, see the ApplicationProperties class
# to have type-safe configuration, like in the JHipsterProperties above
#
# More documentation is available at:
# https://www.jhipster.tech/common-application-properties/
# ===================================================================

application:
  # Radice dello storage dei media. Il valore predefinito di application.yml è un percorso
  # Windows di sviluppo, che in produzione non esiste: qui è il volume montato dal manifest
  # (deploy/compose.yml), l'unico posto in cui i file dei tenant devono vivere.
  base-path: ${TAURUS_MEDIA_PATH:/var/lib/taurus/media}
