<app-dialog-shell #shell heading="Nuovo tenant" subtitle="Configura l’organizzazione e i suoi limiti iniziali."
    confirmLabel="Crea tenant" [invalidCount]="(!tenant.name?.trim() ? 1 : 0) + (!tenant.code?.trim() ? 1 : 0)"
    (cancel)="cancel()" (confirm)="save()">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <app-form-field label="Nome" forId="name" required
            [error]="shell.validationAttempted && !tenant.name?.trim() ? 'Inserisci il nome del tenant.' : undefined"><input
                pInputText id="name" [(ngModel)]="tenant.name" /></app-form-field>
        <app-form-field label="Codice" forId="code" required
            [error]="shell.validationAttempted && !tenant.code?.trim() ? 'Inserisci un codice.' : undefined"><input
                pInputText id="code" [(ngModel)]="tenant.code" /></app-form-field>
        <app-form-field label="Email" forId="email"><input pInputText id="email" type="email"
                [(ngModel)]="tenant.email" /></app-form-field>
        <app-form-field label="Dominio" forId="domain"><input pInputText id="domain"
                [(ngModel)]="tenant.domain" /></app-form-field>
        <app-form-field label="Numero massimo utenti" forId="maxUsers"><input pInputText id="maxUsers" type="number"
                [min]="-1" [(ngModel)]="tenant.maxUsers" /></app-form-field>
        <app-form-field label="Data di scadenza" forId="expireDate"><p-datepicker inputId="expireDate"
                dateFormat="yy-mm-dd" [showIcon]="true" appendTo="body"
                [(ngModel)]="tenant.expireDate" /></app-form-field>
        <app-form-field label="Stato"><p-togglebutton [(ngModel)]="tenant.active" onLabel="Abilitata"
                offLabel="Disabilitata" /></app-form-field>
        <app-form-field class="md:col-span-2" label="Descrizione" forId="description"><textarea pTextarea
                id="description" rows="5" class="w-full" [(ngModel)]="tenant.description"></textarea></app-form-field>
    </div>
</app-dialog-shell>
