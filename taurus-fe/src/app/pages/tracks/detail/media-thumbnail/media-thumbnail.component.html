<div class="media-preview">
    @if (loading) {
        <p-skeleton width="100%" height="100%" styleClass="media-skeleton" [attr.aria-label]="'Caricamento ' + alt" />
    } @else if (failed) {
        <div class="media-error" role="status">
            <i class="pi pi-image" aria-hidden="true"></i>
            <span>Anteprima non disponibile</span>
            <p-button label="Riprova" icon="pi pi-refresh" size="small" severity="secondary" outlined (onClick)="retry()" />
        </div>
    } @else {
        <p-image #previewImage [src]="imageUrl" [alt]="alt" imageClass="media-image" [preview]="true" appendTo="body" />
    }
</div>
