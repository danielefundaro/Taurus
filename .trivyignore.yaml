# Vulnerabilità e configurazioni che il job `security` ignora. Di norma il file non ha voci: una
# vulnerabilità corretta si risolve aggiornando la dipendenza nella stessa pull request.
#
# Una voce serve solo quando la correzione non si può applicare subito, per esempio perché richiede una
# versione maggiore o un'altra libreria la blocca. Regole (docs/platform-upgrade-spec.md, decisione 13):
# - una voce per identificativo, con il file a cui si applica, il motivo e l'aggiornamento che la toglierà;
# - `expired_at` al massimo a 60 giorni: alla scadenza la voce torna a far fallire la CI, e o
#   l'aggiornamento è arrivato o la scadenza si rinnova con una nuova motivazione nella pull request;
# - la pull request che applica l'aggiornamento toglie la voce.
#
# Il file è nato il 2026-11-06 per l'aggiornamento della piattaforma, che lo ha svuotato il 2026-11-10.
