<p-message [severity]="severity" [closable]="false" [attr.role]="role" styleClass="w-full">
    <div class="inline-alert__content">
        <div>
            <strong>{{ heading }}</strong>
            @if (detail) {
            <span>{{ detail }}</span>
            }
        </div>
        <div class="inline-alert__actions">
            @if (secondaryActionLabel) {
            <p-button [label]="secondaryActionLabel" size="small" text [severity]="severity === 'error' ? 'danger' : 'secondary'"
                (onClick)="secondaryAction.emit()" />
            }
            @if (actionLabel && actionLink) {
            <p-button [label]="actionLabel" size="small" [severity]="severity === 'error' ? 'danger' : 'secondary'" outlined
                [routerLink]="actionLink" [queryParams]="queryParams" />
            } @else if (actionLabel) {
            <p-button [label]="actionLabel" size="small" [severity]="severity === 'error' ? 'danger' : 'secondary'" outlined
                (onClick)="action.emit()" />
            }
        </div>
    </div>
</p-message>
