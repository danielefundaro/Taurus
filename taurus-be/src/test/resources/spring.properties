# Spring tiene in cache un contesto per ogni configurazione di test. Senza limite (il default e' 32)
# gli integration test arrivano a una ventina di contesti vivi, ognuno con il suo pool di connessioni
# e i suoi listener RabbitMQ: con l'heap di 1 GB del fork l'ultimo contesto non riesce piu' ad
# avviarsi e il fork muore per OutOfMemoryError. Oltre il limite Spring chiude il contesto usato
# meno di recente; il container PostgreSQL condiviso resta acceso.
spring.test.context.cache.maxSize=8
