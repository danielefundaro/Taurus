<app-floating-configurator />
<main class="min-h-screen flex items-center justify-center p-6 bg-surface-50 dark:bg-surface-950">
    <section class="card max-w-xl w-full text-center" aria-labelledby="tenant-unavailable-title">
        <div
            class="mx-auto mb-5 w-16 h-16 rounded-full bg-blue-50 dark:bg-blue-950 flex items-center justify-center">
            <i class="pi pi-building text-blue-500 text-3xl" aria-hidden="true"></i></div>
        <span class="text-blue-500 font-bold">Tenant non configurato</span>
        <h1 id="tenant-unavailable-title" class="text-3xl font-semibold mt-2 mb-3">Organizzazione non ancora pronta</h1>
        <p class="text-muted-color mt-0 mb-6">
            @if (tenantCode) {
            L'organizzazione <strong>{{ tenantCode }}</strong> non è ancora stata configurata.
            } @else {
            L'organizzazione selezionata non è ancora stata configurata.
            }
            Contatta un amministratore oppure esci e accedi scegliendo un'altra organizzazione.
        </p>
        <div class="flex flex-wrap justify-center gap-2">
            <p-button label="Riprova" icon="pi pi-refresh" severity="secondary" [outlined]="true" (onClick)="retry()" />
            <p-button label="Esci" icon="pi pi-sign-out" (onClick)="logout()" />
        </div>
    </section>
</main>
