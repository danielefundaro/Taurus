<div class="card">
    <!-- Header -->
    <p-fluid class="flex flex-col sm:flex-row sm:justify-end gap-3 mb-4">
        <p-button label="Nuovo" icon="pi pi-plus" severity="secondary" (onClick)="addNew()"
            *hasRoles="[RolesEnum.SUPER_ADMIN, RolesEnum.ADMIN]" />
        <ng-container *ngIf="layout === 'list'">
            <p-iconfield>
                <p-inputicon class="pi pi-search" />
                <input pInputText type="text" (input)="onGlobalFilter($event)" placeholder="Cerca..." />
            </p-iconfield>
            <p-select [options]="sortOptions" placeholder="Ordina per..." (onChange)="onSortChange($event)" />
        </ng-container>
        <p-select-button [ngModel]="layout" [options]="options" [allowEmpty]="false"
            (ngModelChange)="onLayoutChange($event)">
            <ng-template #item let-option>
                <i class="pi"
                    [ngClass]="{ 'pi-bars': option === 'list', 'pi-calendar': option === 'grid' }"
                    [pTooltip]="option === 'list' ? 'Lista' : 'Calendario'"></i>
            </ng-template>
        </p-select-button>
    </p-fluid>

    <!-- LIST VIEW -->
    <ng-container *ngIf="layout === 'list'">
        <p-dataview [value]="events" [lazy]="true" [lazyLoadOnInit]="true"
            [first]="dataViewLazyLoadEvent.first" [rows]="dataViewLazyLoadEvent.rows"
            [paginator]="true" [paginatorPosition]="events.length > 1 ? 'both' : 'bottom'"
            [totalRecords]="totalRecords" [sortField]="dataViewLazyLoadEvent.sortField"
            [sortOrder]="dataViewLazyLoadEvent.sortOrder" [rowsPerPageOptions]="[5, 10, 20, 30]"
            (onLazyLoad)="onLazyLoad($event)">

            <ng-template #list let-items>
                <div class="flex flex-col">
                    <ng-container *ngFor="let item of items; let i = index">
                        <div class="flex flex-col sm:flex-row sm:items-center p-6 gap-4"
                            [ngClass]="{ 'border-t border-surface': i !== 0 }">
                            <!-- Date circle -->
                            <a class="md:w-20 relative cursor-pointer block" [routerLink]="item.id">
                                <div class="flex flex-col items-center justify-center w-16 h-16 rounded-full bg-primary text-primary-contrast">
                                    <span class="text-lg font-bold leading-none">{{ item.startDate | date:'dd' }}</span>
                                    <span class="text-xs uppercase">{{ item.startDate | date:'MMM' }}</span>
                                </div>
                            </a>
                            <div class="flex flex-col md:flex-row justify-between md:items-center flex-1 gap-6">
                                <div class="flex flex-row md:flex-col justify-between items-start gap-2">
                                    <div>
                                        <a class="text-2xl font-semibold cursor-pointer block" [routerLink]="item.id">
                                            {{ item.name }}
                                        </a>
                                        <span class="font-medium text-surface-500 dark:text-surface-400 text-sm">
                                            <i class="pi pi-map-marker mr-1"></i>{{ item.location }}
                                        </span>
                                    </div>
                                    <div class="flex gap-2 flex-wrap">
                                        <p-tag icon="pi pi-clock" severity="secondary"
                                            [value]="(item.startDate | date:'HH:mm') ?? ''" [rounded]="true"
                                            *ngIf="item.startDate"></p-tag>
                                        <p-tag icon="pi pi-tag" severity="secondary"
                                            value="{{ item.state }}" [rounded]="true"
                                            *ngIf="item.state"></p-tag>
                                    </div>
                                </div>
                                <div class="flex flex-row gap-2">
                                    <p-button icon="pi pi-pencil" label="Dettaglio" [routerLink]="item.id"
                                        styleClass="flex-auto md:flex-initial whitespace-nowrap"></p-button>
                                    <p-button icon="pi pi-trash" styleClass="h-full" [outlined]="true"
                                        pTooltip="Elimina" (onClick)="deleteElement(item)"
                                        *hasRoles="[RolesEnum.SUPER_ADMIN, RolesEnum.ADMIN]"></p-button>
                                </div>
                            </div>
                        </div>
                    </ng-container>
                </div>
            </ng-template>
        </p-dataview>
    </ng-container>

    <!-- CALENDAR VIEW -->
    <ng-container *ngIf="layout === 'grid'">
        <!-- Month navigation -->
        <div class="flex items-center justify-between mb-4 px-2 flex-wrap gap-2">
            <div class="flex items-center gap-1">
                <p-button label="Oggi" icon="pi pi-calendar" size="small" [outlined]="true"
                    severity="secondary" (onClick)="goToToday()" pTooltip="Torna al mese corrente"
                    tooltipPosition="bottom" />
                <p-button icon="pi pi-chevron-left" [text]="true" (onClick)="prevMonth()"
                    pTooltip="Mese precedente" tooltipPosition="bottom" />
            </div>

            <p-button [label]="currentMonthLabel" [text]="true" icon="pi pi-chevron-down"
                iconPos="right" styleClass="text-xl! font-semibold!"
                (onClick)="monthPicker.toggle($event)" />

            <p-button icon="pi pi-chevron-right" [text]="true" (onClick)="nextMonth()"
                pTooltip="Mese successivo" tooltipPosition="bottom" />
        </div>

        <p-popover #monthPicker>
            <p-datepicker [(ngModel)]="currentMonth" view="month" dateFormat="mm/yy"
                [inline]="true" (ngModelChange)="onMonthSelected()" />
        </p-popover>

        <!-- Day-of-week headers -->
        <div class="calendar-header">
            <div *ngFor="let day of DAY_LABELS" class="calendar-header-cell">
                {{ day }}
            </div>
        </div>

        <!-- Calendar grid -->
        <div class="calendar-grid">
            <div *ngFor="let day of calendarDays"
                class="calendar-day"
                [class.other-month]="!day.isCurrentMonth"
                [class.today]="day.isToday"
                [class.future]="day.isFuture"
                (dblclick)="openCreateOnDate(day.date)">
                <div class="day-number">{{ day.date.getDate() }}</div>
                <ng-container *ngFor="let event of day.events | slice:0:3">
                    <a [routerLink]="'/calendar/' + event.id" class="calendar-event">
                        <ng-container *ngIf="event.startDate">
                            <i class="pi pi-clock mr-1" style="font-size:0.6rem"></i>{{ event.startDate | date:'HH:mm' }}
                        </ng-container>
                        {{ event.name }}
                    </a>
                </ng-container>
                <div *ngIf="day.events.length > 3" class="more-events">
                    +{{ day.events.length - 3 }} altri
                </div>
            </div>
        </div>
    </ng-container>

    <p-scrolltop />
</div>
