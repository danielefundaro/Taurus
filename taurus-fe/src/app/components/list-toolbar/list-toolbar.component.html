<div class="list-toolbar" role="search">
    @if (showSearch) {
    <p-iconfield class="list-toolbar__search">
        <p-inputicon class="pi pi-search" />
        <input pInputText type="search" [ngModel]="search" (ngModelChange)="updateSearch($event)"
            [placeholder]="searchPlaceholder" aria-label="Cerca nell’elenco" />
    </p-iconfield>
    }
    @if (sortOptions.length) {
    <p-select [ngModel]="sort" (ngModelChange)="sortChange.emit($event)" [options]="sortOptions" optionLabel="label"
        optionValue="value" placeholder="Ordina per…" ariaLabel="Ordina elenco" />
    }
    <ng-content select="[listFilters]" />
    <span class="list-toolbar__spacer"></span>
    @if (showLayout && layout) {
    <p-selectbutton [ngModel]="layout" (ngModelChange)="layoutChange.emit($event)" [allowEmpty]="false"
        [options]="['list', 'grid']" aria-label="Vista elenco">
        <!-- Il modello dell'elemento sostituisce l'etichetta del pulsante: senza un testo per i
             lettori di schermo i due pulsanti resterebbero senza nome, con la sola icona. -->
        <ng-template #item let-item><i [class]="item === 'list' ? 'pi pi-bars' : gridIcon"
                aria-hidden="true"></i><span class="sr-only">{{ item === 'list' ? 'Elenco' : 'Griglia'
            }}</span></ng-template>
    </p-selectbutton>
    }
</div>
