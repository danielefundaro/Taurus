<p-confirmdialog />
<header class="mb-6">
    <h1 class="text-3xl font-semibold m-0">Dashboard</h1>
    <p class="text-muted-color mt-2 mb-0">Panoramica delle attività e dei contenuti più recenti.</p>
    @if (operations?.generatedAt) {
    <p class="text-muted-color text-sm mt-1 mb-0">Ultimo aggiornamento: {{ operations!.generatedAt | date: 'dd/MM/yyyy
        HH:mm' }}</p>
    }
</header>
<!-- A 320 px i soli spazi di `gap-8` chiedono 308 px e la griglia sporge dalla pagina: lo spazio
     ridotto, come nelle altre pagine, torna a quello pieno quando lo schermo lo consente. -->
<div class="grid grid-cols-12 gap-4 md:gap-8">
    <app-operations-widget appTourAnchor="dashboard.operations" [dashboard]="operations" [initialLoading]="operationsInitialLoading"
        [refreshing]="operationsRefreshing" [error]="operationsError" [refreshWarning]="operationsRefreshWarning"
        [announcement]="operationsAnnouncement" (refreshRequested)="refreshOperations()" />
    <app-stats-widget appTourAnchor="dashboard.stats" *hasRoles="[RoleEnums.SUPER_ADMIN]" label="Tenant" icon="pi-building" color="cyan"
        [value]="totalTenants" [link]="'tenants'" />
    <app-stats-widget appTourAnchor="dashboard.stats" *hasRoles="[RoleEnums.SUPER_ADMIN, RoleEnums.ADMIN, RoleEnums.BOARD]" label="Utenti" icon="pi-users" color="blue"
        [value]="totalUsers" [link]="'users'" />
    <app-stats-widget appTourAnchor="dashboard.stats" *hasRoles="[RoleEnums.SUPER_ADMIN, RoleEnums.ADMIN, RoleEnums.BOARD, RoleEnums.ARCHIVIST, RoleEnums.USER]"
        label="Album" icon="pi-book" color="orange" [value]="totalAlbums" [link]="'albums'" />
    <app-stats-widget appTourAnchor="dashboard.stats" *hasRoles="[RoleEnums.SUPER_ADMIN, RoleEnums.ADMIN, RoleEnums.BOARD, RoleEnums.ARCHIVIST, RoleEnums.USER]"
        label="Tracce" icon="pi-file" color="green" [value]="totalTracks" [link]="'tracks'" />

    @if (inventoryEnabled()) {
    <app-inventory-widget appTourAnchor="dashboard.inventory"
        *hasRoles="[RoleEnums.SUPER_ADMIN, RoleEnums.ADMIN, RoleEnums.BOARD, RoleEnums.ARCHIVIST, RoleEnums.USER, RoleEnums.USER_EXTERNAL]"
        [mode]="inventoryMode" [adminSummary]="inventoryAdminSummary" [userSummary]="inventoryUserSummary"
        [recentAssignments]="recentInventoryAssignments" [loading]="inventoryLoading" />
    }

    <app-recents-widget appTourAnchor="dashboard.recents" [tracks]="tracks" />
    @if (calendarEnabled()) {
    <app-calendar-events-widget appTourAnchor="dashboard.events" [events]="upcomingEvents" (pageChange)="upcomingEventsPageChange($event)" />
    }
    <div class="col-span-12 xl:col-span-6" appTourAnchor="dashboard.notifications">
        <app-notifications-widget [notices]="notices" [view]="noticeView" [timeZone]="noticeTimeZone"
            (viewChange)="changeNoticeView($event)"
            (pageChange)="pageChange($event)" (markAsRead)="markNoticesAsRead($event)"
            (navigateToNotice)="navigateToNotice($event)" (delete)="deleteNotices($event)"
            (snooze)="snoozeNotice($event)" (unsnooze)="unsnoozeNotice($event)"
            (disableCategory)="disableNoticeCategory($event)" />
    </div>
</div>
