name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.modules.outputs.backend }}
      frontend: ${{ steps.modules.outputs.frontend }}
      omr: ${{ steps.modules.outputs.omr }}
      keycloak: ${{ steps.modules.outputs.keycloak }}
      info_site: ${{ steps.modules.outputs.info_site }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Collect changed files
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BASE_SHA"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}"; then
            git ls-files > changed-files.txt
          else
            git diff --name-only "$base" "$GITHUB_SHA" > changed-files.txt
          fi
      - name: Detect affected modules
        id: modules
        run: node scripts/docs/affected-modules.mjs changed-files.txt >> "$GITHUB_OUTPUT"

  documentation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Validate catalog
        run: node scripts/docs/validate-feature-catalog.mjs
      - name: Test documentation tooling
        run: node --test scripts/docs/feature-catalog.test.mjs
      - name: Test error catalog check
        run: node --test scripts/docs/error-catalog.test.mjs
      - name: Check error catalog
        run: node scripts/docs/check-error-catalog.mjs
      - name: Verify generated matrix
        run: |
          node scripts/docs/generate-feature-index.mjs
          git diff --exit-code -- docs/features.md
      - name: Collect changed files
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="$PR_BASE_SHA"
          else
            base="$PUSH_BASE_SHA"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}"; then
            git ls-files > changed-files.txt
          else
            git diff --name-only "$base" "$GITHUB_SHA" > changed-files.txt
          fi
      - name: Report possible documentation drift
        run: node scripts/docs/check-feature-drift.mjs --changed-files changed-files.txt
      # Il manifest di produzione: valido, con le porte sul loopback, i dati su volumi, le
      # restrizioni del servizio OMR e Keycloak in modalita' produzione.
      - name: Validate the production manifest
        run: bash scripts/ops/validate-deploy-manifest.sh
      # I certificati delle CA della CIE: che il bundle versionato sia leggibile e contenga
      # esattamente le impronte attese. Senza rete, perche' ogni modifica non deve dipendere dalla
      # disponibilita' di AgID; il confronto con la fonte lo fa il workflow `cie-trust-anchors`.
      - name: Verify the CIE trust anchors
        run: node scripts/ops/fetch-cie-trust-anchors.mjs --verify-bundle

  backend:
    needs: [changes, documentation]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taurus-be
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      # requireDocker: un test P0 che si salta per Docker assente renderebbe il run incompleto.
      - run: ./mvnw verify -Dtaurus.test.requireDocker=true
      - name: Keep the test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-reports
          path: |
            taurus-be/target/surefire-reports
            taurus-be/target/failsafe-reports
            taurus-be/target/site/jacoco
            taurus-be/target/site/jacoco-it
          retention-days: 30

  frontend:
    needs: [changes, documentation]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taurus-fe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: taurus-fe/package-lock.json
      - run: npm ci
      # Le ancore citate dal catalogo della guida devono esistere nell'interfaccia.
      - run: npm run check:tour-anchors
      # Esegue i test con la copertura e fallisce se scende sotto la baseline.
      - run: npm run test:coverage
      - run: npm run build
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: taurus-fe/coverage
          retention-days: 30

  omr:
    needs: [changes, documentation]
    if: needs.changes.outputs.omr == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taurus-omr
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: taurus-omr/requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: python -m pytest
      # Builds the complete image: every pinned download and checksum is verified again.
      - run: docker build -t taurus-omr:verify .
      # Accuracy of the real engines on the reference corpus, with the restrictions of omr.yml; the results are in the
      # job summary.
      - name: Check the accuracy of the engines
        env:
          TAURUS_OMR_ACCURACY_URL: http://127.0.0.1:8090
          TAURUS_OMR_ACCURACY_KEY: accuracy-check-key-0123456789
        run: |
          docker run -d --name taurus-omr-verify -p 127.0.0.1:8090:8090 -e TAURUS_OMR_API_KEY="$TAURUS_OMR_ACCURACY_KEY" \
            --read-only --tmpfs /tmp:rw,exec,size=2g --security-opt no-new-privileges:true --cap-drop ALL taurus-omr:verify
          for attempt in $(seq 60); do curl -fs "$TAURUS_OMR_ACCURACY_URL/v1/health" && break; sleep 2; done
          python -m pytest tests/test_accuracy.py -v -s
      - if: failure()
        run: docker logs taurus-omr-verify || true

  keycloak:
    needs: [changes, documentation]
    if: needs.changes.outputs.keycloak == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: keycloak-authenticator
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # La versione di Java dell'immagine di Keycloak, per cui il provider si compila.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw verify

  info-site:
    needs: [changes, documentation]
    if: needs.changes.outputs.info_site == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taurus-info
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # La versione di pnpm è quella di `packageManager` nel package.json del sito.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: taurus-info/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: taurus-info/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      # File attesi, metadati e accessibilita' strutturale di ogni pagina, collegamenti interni, sitemap e intestazioni del server.
      - run: pnpm test
      # Immagine nginx costruita e interrogata come farebbe un browser: il runner ha Docker, quindi la sua assenza e' un errore.
      - run: pnpm test:image
        env:
          TAURUS_REQUIRE_DOCKER: '1'

  security:
    needs: documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Segreti: il binario di gitleaks, senza l'azione, che per le organizzazioni chiede una licenza.
      # Le immagini di gitleaks e semgrep sono fissate per digest come le azioni, ma Dependabot non
      # le vede dentro `run`, né vede la versione di Trivy più sotto: si aggiornano a mano, insieme
      # al Runbook di test (sezione 8.7).
      - name: Scan for secrets
        run: |
          docker run --rm -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source /repo --config /repo/.gitleaks.toml --redact --no-banner --exit-code 1
      # Trivy cerca i POM padre e quelli delle dipendenze prima nel repository Maven locale, poi su
      # Maven Central. Senza questi passi le dipendenze gestite da Spring Boot restavano fuori dalla
      # scansione senza errori, e da Trivy 0.71 un 429 di Maven Central la ferma. La cache è quella
      # del job `backend`, con la stessa chiave.
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Resolve the Maven dependencies
        run: |
          (cd taurus-be && ./mvnw -B -q dependency:resolve)
          (cd keycloak-authenticator && ./mvnw -B -q dependency:resolve)
      # Dipendenze e configurazioni: vulnerabilita' note di Maven, npm, pip e dei Dockerfile.
      - name: Scan dependencies and configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          # Eccezioni a scadenza, ciascuna con la fase che la risolve: docs/platform-upgrade-spec.md, decisione 13.
          trivyignores: .trivyignore.yaml
          # Esplicita: senza, l'azione usa la versione predefinita della sua release.
          version: v0.76.2
          exit-code: '1'
      # Analisi statica di sicurezza: regole libere di semgrep, senza account.
      - name: Static analysis
        run: |
          docker run --rm -v "$PWD:/src" \
            semgrep/semgrep:1.183.0@sha256:2e45517a85e13a9cca14a2a00df6bb48affd66b8ebfae1b0991cd57578362fb0 \
            semgrep scan --config p/ci --error --quiet --metrics=off
