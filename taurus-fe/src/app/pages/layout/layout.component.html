<div class="layout-wrapper" [ngClass]="containerClass">
    <app-topbar></app-topbar>
    <app-sidebar></app-sidebar>
    <div class="layout-main-container">
        @if (pushPromptVisible) {
        <div class="flex flex-wrap items-center gap-2 mb-4">
            <app-inline-alert class="flex-1" severity="info" heading="Promemoria degli eventi"
                detail="Attiva le notifiche del browser per ricevere un promemoria prima degli eventi a cui hai dato disponibilità."
                actionLabel="Attiva notifiche" (action)="enablePush()" />
            <p-button label="Non ora" size="small" [text]="true" severity="secondary" (onClick)="dismissPushPrompt()" />
        </div>
        }
        <div class="layout-main">
            <router-outlet></router-outlet>
        </div>
        <app-footer></app-footer>
    </div>
    <div class="layout-mask animate-fadein"></div>
</div>
