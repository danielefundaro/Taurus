# Le intestazioni di sicurezza di ogni risposta del sito.
#
# Stanno in un file a parte perché nginx non eredita gli `add_header` del blocco `server` in un
# `location` che ne dichiara di propri: senza questo include, una pagina servita da un `location`
# con il suo Cache-Control uscirebbe senza nessuna di queste intestazioni. Va incluso nel blocco
# `server` e in ogni `location` che usa `add_header`.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; form-action 'self' mailto:; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" always;
