<p-confirmdialog />

<p-fluid>
    <app-page-header kicker="Profilo" [title]="(firstName || '') + ' ' + (lastName || '')" [subtitle]="'@' + username" [dirty]="isDirty"
        ><div pageActions><p-button label="Salva profilo" icon="pi pi-check" [loading]="saving" [disabled]="!isDirty" (onClick)="saveProfile()" /></div
    ></app-page-header>

    <div class="card flex flex-row items-center gap-4" aria-label="Immagine del profilo">
        <div class="profile-avatar flex items-center justify-center rounded-full bg-primary text-surface-900 dark:text-surface-0">
            <i class="pi pi-user"></i>
        </div>
        <div>
            <strong class="block">{{ firstName }} {{ lastName }}</strong>
            <span class="text-sm text-muted-color">{{ email }}</span>
        </div>
    </div>

    <app-detail-section title="Informazioni personali" description="Nome, cognome ed email. Si salvano con «Salva profilo» in alto." [dirty]="isDirty">
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <app-form-field label="Nome" forId="firstName">
                <input pInputText id="firstName" [(ngModel)]="firstName" (ngModelChange)="isDirty = true" placeholder="Nome" />
            </app-form-field>
            <app-form-field label="Cognome" forId="lastName">
                <input pInputText id="lastName" [(ngModel)]="lastName" (ngModelChange)="isDirty = true" placeholder="Cognome" />
            </app-form-field>
            <app-form-field label="Email" forId="email">
                <input pInputText id="email" type="email" [(ngModel)]="email" (ngModelChange)="isDirty = true" placeholder="Email" />
            </app-form-field>
            <app-form-field label="Nome utente" forId="username" hint="Non modificabile">
                <input pInputText id="username" [ngModel]="username" disabled placeholder="Nome utente" />
            </app-form-field>
        </div>
    </app-detail-section>

    <app-detail-section title="Eventi a cui hai partecipato" description="Sola lettura: le presenze si registrano dalla pagina dell’evento.">
        <app-calendar-events-table />
    </app-detail-section>

    <app-detail-section title="Sicurezza" description="Gestisci la password e l’autenticazione a due fattori.">
        <div class="flex flex-col sm:flex-row gap-3">
            <p-button label="Cambia password" icon="pi pi-lock" severity="secondary" (onClick)="changePassword()" />
            <p-button label="Configura autenticatore OTP" icon="pi pi-shield" severity="secondary" (onClick)="configureOTP()" />
        </div>
    </app-detail-section>

    <app-detail-section title="Sessione" description="Termina la sessione corrente e disconnettiti.">
        <div sectionActions>
            <p-button label="Logout" icon="pi pi-sign-out" severity="warn" [outlined]="true" (onClick)="logout()" />
        </div>
    </app-detail-section>

    <app-danger-zone
        [operations]="[
            { id: 'deactivate', title: 'Disattiva account', consequence: 'I dati verranno conservati per un eventuale ripristino.', label: 'Disattiva account', icon: 'pi pi-user-minus' },
            { id: 'gdpr', title: 'Cancellazione GDPR', consequence: 'L’account e i dati personali verranno eliminati definitivamente.', label: 'Elimina definitivamente (GDPR)' }
        ]"
        (execute)="$event === 'deactivate' ? confirmDeleteAccount() : confirmGdprDeletion()"
    />
</p-fluid>
