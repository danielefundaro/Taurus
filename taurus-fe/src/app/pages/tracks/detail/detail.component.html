<p-fluid>
    <!-- Card: informazioni traccia -->
    <div class="flex">
        <div class="card flex flex-col gap-4 w-full">
            <div class="flex flex-row justify-between items-center">
                <div class="flex items-center gap-2">
                    <span class="font-semibold text-xl">Traccia</span>
                    <span *ngIf="isDirty" class="w-2 h-2 rounded-full bg-amber-400 flex-shrink-0" title="Modifiche non salvate"></span>
                </div>
                <div class="flex flex-row gap-2">
                    <p-button label="Salva" icon="pi pi-check" severity="primary" [loading]="isSaving" [disabled]="!isDirty" (onClick)="save()"
                        *hasRoles="[RolesEnum.SUPER_ADMIN, RolesEnum.ADMIN, RolesEnum.ARCHIVIST]" />
                    <p-button label="Anteprima" icon="pi pi-print" severity="secondary" (onClick)="preview()"
                        [disabled]="!track.scores?.length"
                        [pTooltip]="track.scores?.length ? '' : previewTooltip"
                        tooltipPosition="top" />
                </div>
            </div>
            <p-confirmdialog />
            <div class="flex flex-col md:flex-row gap-6">
                <p-floatlabel class="flex w-full" variant="on">
                    <input pInputText id="name" type="text" [(ngModel)]="track!.name" [readOnly]="isUser"
                        (ngModelChange)="isDirty = true" />
                    <label for="name">Nome</label>
                </p-floatlabel>
                <p-floatlabel class="flex w-full" variant="on">
                    <input pInputText id="composer" type="text" [(ngModel)]="track!.composer" [readOnly]="isUser"
                        (ngModelChange)="isDirty = true" />
                    <label for="composer">Compositore</label>
                </p-floatlabel>
                <p-floatlabel class="flex w-full" variant="on">
                    <input pInputText id="arranger" type="text" [(ngModel)]="track!.arranger" [readOnly]="isUser"
                        (ngModelChange)="isDirty = true" />
                    <label for="arranger">Arrangiatore</label>
                </p-floatlabel>
                <p-floatlabel class="flex w-full" variant="on"
                    *hasRoles="[RolesEnum.SUPER_ADMIN, RolesEnum.ADMIN, RolesEnum.ARCHIVIST]">
                    <p-autocomplete inputId="states" [(ngModel)]="track!.state" [suggestions]="autoFilteredStates" [virtualScroll]="true"
                        [virtualScrollItemSize]="34" dropdown display="chip" (completeMethod)="filterStates($event)"
                        (ngModelChange)="isDirty = true" />
                    <label for="states">Stato</label>
                </p-floatlabel>
            </div>
            <app-type-handler variant="on" label="Tipo" [types]="track!.type" (typesChange)="onTypeChange($event)"
                [readOnly]="isUser" />
            <p-floatlabel class="flex" variant="on">
                <textarea pTextarea id="description" rows="4" [(ngModel)]="track!.description" [readOnly]="isUser"
                    (ngModelChange)="isDirty = true"></textarea>
                <label for="description">Descrizione</label>
            </p-floatlabel>
        </div>
    </div>

    <!-- Card: file pdf -->
    <div class="card mt-4" *hasRoles="[RolesEnum.SUPER_ADMIN, RolesEnum.ADMIN, RolesEnum.ARCHIVIST]">
        <span class="font-semibold text-lg block mb-4">File pdf</span>
        <p-fileupload #fu name="file" chooseLabel="Seleziona file" uploadLabel="Carica" cancelLabel="Annulla"
            mode="advanced" accept="application/pdf" [headers]="httpHeaders()" [url]="trackStream()"
            (onUpload)="onUploadSuccess()" (onError)="onUploadError()">
            <ng-template #empty>
                <div>Trascina il file qui per caricarlo.</div>
            </ng-template>
        </p-fileupload>
    </div>

    <!-- Tabella parti -->
    <p-table #dt class="minw-75rem mt-4" [value]="track.scores!" [rows]="10" [columns]="cols" [paginator]="true"
        [globalFilterFields]="['name']" [(selection)]="selectedScores" [rowHover]="true" dataKey="order"
        currentPageReportTemplate="Da {first} a {last} di {totalRecords} parti" [showCurrentPageReport]="true"
        [rowsPerPageOptions]="[10, 20, 30]" (onRowReorder)="onRowReorder()">
        <ng-template #caption>
            <div class="flex items-center justify-between flex-wrap gap-3">
                <div class="flex gap-2" *hasRoles="[RolesEnum.SUPER_ADMIN, RolesEnum.ADMIN, RolesEnum.ARCHIVIST]">
                    <p-button severity="primary" label="Aggiungi parte" icon="pi pi-plus" outlined (onClick)="addNew()" />
                    <p-button severity="secondary" label="Elimina selezionati" icon="pi pi-trash" outlined
                        (onClick)="confirmDeleteSelectedScores()" [disabled]="!selectedScores.length" />
                </div>
                <p-iconfield>
                    <p-inputicon styleClass="pi pi-search" />
                    <input pInputText type="text" (input)="onGlobalFilter(dt, $event)" placeholder="Cerca parte..." />
                </p-iconfield>
            </div>
        </ng-template>
        <ng-template #header>
            <tr>
                <th class="w-12" scope="col">
                    <p-tableHeaderCheckbox />
                </th>
                <th class="w-10" scope="col"></th>
                <th pSortableColumn="order" class="minw-8rem" scope="col">
                    Ordine
                    <p-sortIcon field="order" />
                </th>
                <th class="minw-8rem" scope="col">
                    Media
                </th>
                <th pSortableColumn="instruments" class="minw-8rem" scope="col">
                    Strumenti
                    <p-sortIcon field="instruments.name" />
                </th>
                <th class="minw-2rem" scope="col"></th>
            </tr>
        </ng-template>
        <ng-template #body let-score let-rowIndex="rowIndex">
            <tr [pReorderableRow]="rowIndex">
                <td class="w-12">
                    <p-tableCheckbox [value]="score" />
                </td>
                <td class="w-10">
                    <span *ngIf="!isUser" class="pi pi-bars text-surface-400" style="cursor: grab" pReorderableRowHandle></span>
                </td>
                <td class="minw-8rem">{{ score.order }}</td>
                <td class="minw-8rem">
                    <div class="flex flex-col items-start">
                        <span class="text-sm text-surface-400 mb-1">
                            {{ score.media?.length ?? 0 }} {{ (score.media?.length ?? 0) === 1 ? 'pagina' : 'pagine' }}
                        </span>
                        <div pDroppable class="flex flex-col md:flex-row flex-wrap gap-2 minh-2rem mt-1 w-100"
                            (onDrop)="drop(score)">
                            <ng-container *ngFor="let media of score!.media">
                                <div pDraggable class="div-image pi pi-image cursor-pointer"
                                    (click)="toggleDataTable(op2, $event)" (keydown)="toggleDataTable(op2, $event)"
                                    (keypress)="toggleDataTable(op2, $event)" (keyup)="toggleDataTable(op2, $event)"
                                    (onDragStart)="dragStart(score, media)" (onDragEnd)="dragEnd()">
                                    <p-popover #op2 [style]="{width: '50rem'}">
                                        <img [src]="mediaStream(media) | secure | async" class="w-50"
                                            alt="sheet-music-{{media.index}}" />
                                    </p-popover>
                                </div>
                            </ng-container>
                        </div>
                        <p-button icon="pi pi-images" label="Visualizza" (onClick)="showMedia(score.media)"
                            class="mt-2 block" *ngIf="score!.media?.length >= 3" />
                    </div>
                </td>
                <td class="minw-8rem">
                    <div class="flex flex-col md:flex-row gap-2" *ngIf="score.instruments?.length">
                        <p-tag [value]="instrument.name" [rounded]="true" severity="success"
                            *ngFor="let instrument of score.instruments"></p-tag>
                    </div>
                </td>
                <td class="minw-2rem">
                    <div class="flex flex-col md:flex-row gap-2">
                        <p-button icon="pi pi-pencil" [rounded]="true" [outlined]="true"
                            pTooltip="Modifica" tooltipPosition="top" (onClick)="editScore(score)"
                            *hasRoles="[RolesEnum.SUPER_ADMIN, RolesEnum.ADMIN, RolesEnum.ARCHIVIST]" />
                        <p-button icon="pi pi-trash" severity="danger" [rounded]="true" [outlined]="true"
                            pTooltip="Elimina" tooltipPosition="top" (onClick)="confirmDeleteScore(score)"
                            *hasRoles="[RolesEnum.SUPER_ADMIN, RolesEnum.ADMIN, RolesEnum.ARCHIVIST]" />
                    </div>
                </td>
            </tr>
        </ng-template>
        <ng-template #emptymessage>
            <tr>
                <td colspan="6" class="text-center py-6 text-color-secondary">Nessuna parte presente.</td>
            </tr>
        </ng-template>
    </p-table>

    <!-- Zona pericolosa -->
    <div class="card danger-zone mt-8" *hasRoles="[RolesEnum.SUPER_ADMIN, RolesEnum.ADMIN, RolesEnum.ARCHIVIST]">
        <span class="danger-zone-label font-semibold text-sm block mb-3">Zona pericolosa</span>
        <div class="flex flex-row justify-between items-center gap-4">
            <span class="text-sm text-surface-500">Elimina definitivamente questa traccia e tutti i file associati.</span>
            <p-button label="Elimina traccia" icon="pi pi-trash" severity="danger" [outlined]="true"
                (onClick)="confirmDelete()" />
        </div>
    </div>

    <p-scrolltop />
</p-fluid>

<p-galleria [value]="images" [(visible)]="displayGalleria" [responsiveOptions]="responsiveOptions" [numVisible]="5"
    [autoPlay]="true" [circular]="true" [fullScreen]="true" [transitionInterval]="3000" [showIndicators]="true"
    [showThumbnails]="false" [changeItemOnIndicatorHover]="true" [showItemNavigators]="true"
    [containerStyle]="{ 'max-width': '60rem' }">
    <ng-template #item let-media>
        <img class="image-galleria" [src]="media | secure | async" alt="sheet-music-{{media.index}}" />
    </ng-template>
</p-galleria>
