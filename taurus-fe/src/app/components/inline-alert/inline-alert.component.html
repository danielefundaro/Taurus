<p-message [severity]="severity" [closable]="false" [attr.role]="role" styleClass="w-full">
    <div class="inline-alert__content">
        <div>
            <strong>{{ title }}</strong>
            @if (detail) {
                <span>{{ detail }}</span>
            }
        </div>
        @if (actionLabel && actionLink) {
            <p-button [label]="actionLabel" size="small" [severity]="severity === 'error' ? 'danger' : 'secondary'" outlined [routerLink]="actionLink" [queryParams]="queryParams" />
        } @else if (actionLabel) {
            <p-button [label]="actionLabel" size="small" [severity]="severity === 'error' ? 'danger' : 'secondary'" outlined (onClick)="action.emit()" />
        }
    </div>
</p-message>
