junit.jupiter.execution.timeout.default=15 s
junit.jupiter.execution.timeout.testable.method.default=15 s
# Il @BeforeAll degli integration test prepara lo schema di un tenant, cioe' esegue tutte le
# migration Liquibase sul container: su una macchina lenta costa circa un minuto, e con 60 s il
# limite scattava a provisioning quasi finito. Il tetto resta per fermare un blocco vero, non
# per misurare la velocita' del container; il limite dei singoli test resta 15 s.
junit.jupiter.execution.timeout.beforeall.method.default=180 s
junit.jupiter.testclass.order.default=com.fundaro.zodiac.taurus.config.SpringBootTestClassOrderer
