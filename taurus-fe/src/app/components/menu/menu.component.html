<ul class="layout-menu" appTourAnchor="layout.menu">
    @for (item of model; track item; let i = $index) {
        @if (!item['hasRoles']) {
            @if (!item.separator) {
                <li app-menuitem [item]="item" [index]="i" [root]="true"></li>
            } @else {
                <li class="menu-separator"></li>
            }
        } @else {
            <ng-container *hasRoles="item['hasRoles']">
                @if (!item.separator) {
                    <li app-menuitem [item]="item" [index]="i" [root]="true"></li>
                } @else {
                    <li class="menu-separator"></li>
                }
            </ng-container>
        }
    }
</ul>
