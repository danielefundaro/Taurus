<app-dialog-shell
    title="Nuovo utente"
    subtitle="Crea l’utente e definisci ruoli e strumenti."
    confirmLabel="Aggiungi utente"
    [invalidCount]="(!user.name?.trim() ? 1 : 0) + (!user.email?.trim() ? 1 : 0) + (!user.roles?.length ? 1 : 0)"
    (cancel)="cancel()"
    (confirm)="save()"
>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <app-form-field label="Nome" forId="name" required [error]="user.name?.trim() ? undefined : 'Inserisci il nome.'"><input pInputText id="name" [(ngModel)]="user.name" /></app-form-field>
        <app-form-field label="Cognome" forId="lastName"><input pInputText id="lastName" [(ngModel)]="user.lastName" /></app-form-field>
        <app-form-field label="Email" forId="email" required [error]="user.email?.trim() ? undefined : 'Inserisci l’indirizzo email.'"><input pInputText id="email" type="email" [(ngModel)]="user.email" /></app-form-field>
        <app-form-field label="Data di nascita" forId="birthDate"><p-datepicker inputId="birthDate" dateFormat="dd-mm-yy" [showIcon]="true" [(ngModel)]="user.birthDate" /></app-form-field>
        <app-form-field label="Ruoli" required [error]="user.roles?.length ? undefined : 'Seleziona almeno un ruolo.'"
            ><p-autocomplete [(ngModel)]="user.roles" [suggestions]="autoFilteredRoles" dropdown multiple display="chip" (completeMethod)="filterRoles($event)"
        /></app-form-field>
        <app-form-field label="Stato"
            ><label class="flex items-center gap-2"><p-checkbox [binary]="true" [(ngModel)]="user.active" /> Utente attivo</label></app-form-field
        >
        <app-form-field class="md:col-span-2" label="Strumenti"
            ><p-autocomplete [(ngModel)]="user.instruments" [suggestions]="autoFilteredInstruments" optionLabel="name" dropdown multiple display="chip" (completeMethod)="filterInstruments($event)" (ngModelChange)="onReorderInstruments()"
        /></app-form-field>
        <app-form-field class="md:col-span-2" label="Descrizione" forId="description"><textarea pTextarea id="description" rows="5" class="w-full" [(ngModel)]="user.description"></textarea></app-form-field>
    </div>
</app-dialog-shell>
