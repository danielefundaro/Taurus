<div class="fixed flex gap-4 top-8 right-8">
    <p-button type="button" (onClick)="toggleDarkMode()" [rounded]="true"
        [icon]="isDarkTheme() ? 'pi pi-moon' : 'pi pi-sun'" pTooltip="Cambia tema chiaro/scuro" severity="secondary" />
    <div class="relative">
        <p-button icon="pi pi-palette" pStyleClass="@next" enterFromClass="hidden" enterActiveClass="animate-scalein"
            leaveToClass="hidden" leaveActiveClass="animate-fadeout" [hideOnOutsideClick]="true" pTooltip="Configura il tema" type="button"
            rounded />
        <app-configurator />
    </div>
</div>
