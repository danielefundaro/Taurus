# Aggiornamenti proposti da Dependabot: docs/platform-upgrade-spec.md, decisione 7.
#
# Un blocco per modulo ed ecosistema, ogni lunedì mattina. Patch e minor arrivano in una sola pull
# request per blocco; ogni versione maggiore arriva in una pull request a sé, perché di solito chiede
# modifiche al codice. Le azioni GitHub restano fissate per SHA del commit con la versione in
# commento: Dependabot aggiorna l'uno e l'altro.
#
# `cooldown` aspetta sette giorni dalla pubblicazione di una versione prima di proporla: una
# release ritirata o manomessa, come i tag di trivy-action nel marzo 2026, di solito si scopre in
# quei giorni. Sette è anche il minimo della regola `dependabot-missing-cooldown` di semgrep, nel
# set `p/ci` del job `security`. Gli aggiornamenti di sicurezza non aspettano. Per le immagini
# Docker l'attesa conta dall'ultimo push del tag: un tag mobile come `26-alpine`, ripubblicato
# spesso, può arrivare con qualche settimana di ritardo, mentre un tag fermo passa subito.
#
# Le regole `ignore` tengono fuori le versioni che la specifica esclude (decisioni 2, 3, 8 e 9 ed
# Eccezioni alla versione più recente) e quelle che funzionano solo con la maggiore successiva del
# loro framework, con cui si aggiornano. Una regola legata a una decisione o a un'eccezione si toglie
# con lei.
version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Rome
    cooldown:
      default-days: 7
    groups:
      github-actions-minor-patch:
        update-types: [minor, patch]

  # Backend: dipendenze Maven, strumenti npm di JHipster, immagine e dev container. I compose di
  # sviluppo in src/main/docker hanno nomi che Dependabot non riconosce: si aggiornano a mano.
  - package-ecosystem: maven
    directory: /taurus-be
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Rome
    cooldown:
      default-days: 7
    ignore:
      # Le maggiori di Spring Boot si fanno a mano, una per volta (decisione 2): prima la 3.5, poi la
      # 4.0 e la 4.1. springdoc-openapi segue la maggiore di Spring Boot: la 3 è la linea per Spring
      # Boot 4.
      - dependency-name: 'org.springframework.boot:*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'org.springdoc:*'
        update-types: ['version-update:semver-major']
    groups:
      backend-maven-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /taurus-be
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Rome
    cooldown:
      default-days: 7
    groups:
      backend-npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directories: [/taurus-be, /taurus-be/.devcontainer]
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Rome
    cooldown:
      default-days: 7
    ignore:
      # Il tag di maven contiene la versione di Java (`3.10.0-eclipse-temurin-25`) e Dependabot la
      # legge come parte della versione: proporrebbe sempre la Java più alta, anche non LTS.
      # L'immagine si aggiorna a mano.
      - dependency-name: maven
      # Solo Java LTS (decisione 3): la 25, poi la 29.
      - dependency-name: eclipse-temurin
        versions: ['>=26, <29']
    groups:
      backend-docker-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: maven
    directory: /keycloak-authenticator
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Rome
    cooldown:
      default-days: 7
    groups:
      keycloak-provider-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /taurus-fe
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Rome
    cooldown:
      default-days: 7
    ignore:
      # Le maggiori di Angular, PrimeNG e keycloak-angular si fanno a mano con `ng update`, una per
      # volta (decisione 2). Il frontend resta alla linea 21: dalla 22 PrimeNG, dalla 3
      # `@primeuix/themes` e dalla 8 PrimeIcons hanno la PrimeUI License e non sono più MIT
      # (decisione 5). Minor e patch restano nel gruppo.
      - dependency-name: '@angular/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@angular-devkit/*'
        update-types: ['version-update:semver-major']
      - dependency-name: primeng
        update-types: ['version-update:semver-major']
      - dependency-name: '@primeng/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@primeuix/themes'
        update-types: ['version-update:semver-major']
      - dependency-name: primeicons
        update-types: ['version-update:semver-major']
      - dependency-name: keycloak-angular
        update-types: ['version-update:semver-major']
      # Seguono Angular e PrimeNG e si aggiornano con loro: TypeScript (Angular 21 chiede `>=5.9 <6.0`,
      # come nelle Eccezioni), zone.js (Angular 21 chiede `~0.15.0 || ~0.16.0`) e
      # tailwindcss-primeui (la 0.6 va con Tailwind 4 e i temi nuovi della fase 5). TypeScript non
      # segue semver e nelle versioni 0.x la minor è una maggiore: restano solo le patch.
      - dependency-name: typescript
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: zone.js
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: tailwindcss-primeui
        update-types: ['version-update:semver-major', 'version-update:semver-minor']
    groups:
      frontend-npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /taurus-fe
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Rome
    cooldown:
      default-days: 7
    ignore:
      # Solo Node LTS, cioè le maggiori pari: la 26 è l'obiettivo delle fasi 5 e 6. Le dispari non
      # diventano mai LTS e la 24 è più vecchia dell'obiettivo. Escluderle serve anche per `cooldown`:
      # i tag delle LTS si ripubblicano spesso e restano in attesa, quelli delle dispari finite no.
      - dependency-name: node
        versions: ['>=23, <26', '>=27, <28']
      # Solo la linea stabile di nginx, con le minor pari (decisione 8). Vale anche per
      # `nginxinc/nginx-unprivileged`.
      - dependency-name: 'nginx*'
        versions: ['>=1.31, <1.32', '>=1.33, <1.34']
    groups:
      frontend-docker-minor-patch:
        update-types: [minor, patch]

  # Sito informativo: l'ecosistema npm di Dependabot legge anche pnpm-lock.yaml.
  - package-ecosystem: npm
    directory: /taurus-info
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Rome
    cooldown:
      default-days: 7
    ignore:
      # Le maggiori di Astro e delle sue integrazioni si fanno a mano, una per volta (decisione 2).
      - dependency-name: astro
        update-types: ['version-update:semver-major']
      - dependency-name: '@astrojs/*'
        update-types: ['version-update:semver-major']
      # TypeScript resta alla 6.0, l'ultima che `@astrojs/check` supporta: Eccezioni.
      - dependency-name: typescript
        versions: ['>=7']
    groups:
      info-site-npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /taurus-info
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Rome
    cooldown:
      default-days: 7
    ignore:
      # Come per il frontend: Node solo LTS e nginx solo stabile.
      - dependency-name: node
        versions: ['>=23, <26', '>=27, <28']
      - dependency-name: 'nginx*'
        versions: ['>=1.31, <1.32', '>=1.33, <1.34']
    groups:
      info-site-docker-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker-compose
    directory: /taurus-info
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Rome
    cooldown:
      default-days: 7
    groups:
      info-site-compose-minor-patch:
        update-types: [minor, patch]

  # Servizio OMR: una pull request su requirements.txt va completata come chiede la sua intestazione,
  # con il Dockerfile e models.sha256, e ripetendo test e controlli di accuratezza. Le stesse librerie
  # compaiono anche in requirements-test.txt, che va tenuto allineato.
  - package-ecosystem: pip
    directory: /taurus-omr
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Rome
    cooldown:
      default-days: 7
    ignore:
      # I limiti che homr 0.7.0 dichiara sulle librerie fissate qui (decisione 9 ed Eccezioni).
      # Dependabot non li ricava da solo: legge i file fissati, non le dipendenze di homr.
      - dependency-name: pillow
        versions: ['>=13']
      - dependency-name: opencv-python-headless
        versions: ['>=5']
      - dependency-name: musicxml
        versions: ['>1.4']
      - dependency-name: numpy
        versions: ['>=3']
      - dependency-name: onnxruntime
        versions: ['>=2']
      - dependency-name: rapidocr
        versions: ['>=4']
      - dependency-name: requests
        versions: ['>=3']
      - dependency-name: typing-extensions
        versions: ['>=5']
      - dependency-name: types-pillow
        versions: ['>=11']
    groups:
      omr-pip-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /taurus-omr
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Rome
    cooldown:
      default-days: 7
    ignore:
      # Ubuntu resta alla 24.04 finché Audiveris non pubblica un pacchetto per la 26.04
      # (decisione 9). Il limite esclude anche le versioni intermedie non LTS, come la 24.10.
      - dependency-name: ubuntu
        versions: ['>24.04']
    groups:
      omr-docker-minor-patch:
        update-types: [minor, patch]

  # Manifest di produzione.
  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Rome
    cooldown:
      default-days: 7
    groups:
      deploy-compose-minor-patch:
        update-types: [minor, patch]
