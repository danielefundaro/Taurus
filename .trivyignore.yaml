# Vulnerabilità e configurazioni che il job `security` ignora finché la fase che le risolve non arriva.
# Regole (docs/platform-upgrade-spec.md, decisione 13):
# - una voce per identificativo, con il file a cui si applica, il motivo e la fase che la risolve;
# - ogni voce scade dopo 60 giorni: alla scadenza torna a far fallire la CI, e o la fase è arrivata
#   o la scadenza si rinnova con una nuova motivazione nella pull request;
# - la fase che risolve una vulnerabilità toglie la sua voce; alla fine della fase 8 il file è vuoto.
# Creato il 2026-11-06 nella fase 0; voci Maven del backend e del provider aggiunte il 2026-11-07 nella fase 1.
# Le voci del provider sono tolte il 2026-11-07 nella fase 3, con Spring Boot 4.1.2.
# Quelle del backend sono tolte il 2026-11-08 nella fase 4a, con Spring Boot 3.5.16, tranne le due di
# spring-webmvc, tolte lo stesso giorno nella fase 4b con Spring Boot 4.1.2.

