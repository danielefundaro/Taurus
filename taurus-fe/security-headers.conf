# Le intestazioni di sicurezza di ogni risposta dell'applicazione.
#
# Stanno in un file a parte perché nginx non eredita gli `add_header` del blocco `server` in un
# `location` che ne dichiara di propri: senza questo include, una pagina servita da un `location`
# con il suo Cache-Control uscirebbe senza nessuna di queste intestazioni. Va incluso nel blocco
# `server` e in ogni `location` che usa `add_header`.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=()" always;
# La politica dei contenuti di un'applicazione Angular con il suo service worker:
# - `wasm-unsafe-eval` serve a Verovio, che gira come WebAssembly per disegnare le partiture;
# - `worker-src blob:` al worklet audio di SpessaSynth e ai worker del visualizzatore PDF;
# - `style-src 'unsafe-inline'` agli stili che Angular e PrimeNG scrivono negli elementi;
# - `fonts.cdnfonts.com` serve il foglio di stile e i file del carattere Lato, che index.html
#   carica: una copia servita da qui toglierebbe la dipendenza da terzi, e con essa la richiesta
#   che ogni visitatore fa a un dominio esterno;
# - `connect-src 'self'` basta perché API e Keycloak sono serviti da questa stessa origine
#   (`/api` e `/auth`): una distribuzione che li tiene su un'altra origine deve aggiungerla qui,
#   insieme a `frame-src` se usa il check-sso di Keycloak in un iframe.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data: https://fonts.cdnfonts.com; form-action 'self'; frame-ancestors 'none'; img-src 'self' data: blob:; media-src 'self' blob:; object-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.cdnfonts.com; worker-src 'self' blob:" always;
