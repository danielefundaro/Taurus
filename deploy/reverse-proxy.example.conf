# Esempio del reverse proxy dell'host davanti allo stack: termina TLS e inoltra al container del
# frontend, che a sua volta serve l'applicazione e inoltra /api e /auth.
#
# Non è un file dello stack: va messo nella configurazione di nginx dell'host (per esempio
# /etc/nginx/sites-available/taurus) e il certificato lo gestisce l'host, con Let's Encrypt via
# certbot, che non costa nulla.
#
# Qui vivono due cose che il container non può decidere: il certificato e il nome pubblico. Tutto il
# resto — percorsi, cache, intestazioni di sicurezza — è dentro l'immagine del frontend, così un
# aggiornamento non chiede di rimettere le mani su questo file.

server {
    listen 80;
    listen [::]:80;
    server_name taurus.esempio.it;

    # Solo la verifica di Let's Encrypt resta in chiaro; il resto va su HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name taurus.esempio.it;

    ssl_certificate /etc/letsencrypt/live/taurus.esempio.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/taurus.esempio.it/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    server_tokens off;

    # HSTS lo dichiara chi parla in TLS, cioè questo livello: il container serve in chiaro sul
    # loopback e non saprebbe se la connessione del browser era cifrata.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Il caricamento di un PDF arriva fino al limite del backend.
    client_max_body_size 500m;
    client_body_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Keycloak e il backend costruiscono gli indirizzi pubblici da queste due: senza di esse le
        # redirezioni dell'accesso tornano su http e il browser le rifiuta.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        # L'identificativo di correlazione: il backend lo accetta e lo rimanda nei log e nella
        # risposta, così la stessa richiesta si ritrova nei log del proxy e in quelli dello stack.
        proxy_set_header X-Request-Id $request_id;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
