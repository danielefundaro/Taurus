<!DOCTYPE html>
<!-- Parti del contenuto delle e-mail: le stesse macro di theme/taurus-theme/email/html/template.ftl. -->
<html xmlns:th="http://www.thymeleaf.org">
<body>

<p th:fragment="greeting" style="margin:0 0 8px;font-size:15px;line-height:1.6;color:#475569;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">Ciao,</p>

<p th:fragment="paragraph(text)" style="margin:0 0 16px;font-size:15px;line-height:1.6;color:#475569;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;" th:text="${text}"></p>

<table th:fragment="details(rows)" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin:0 0 20px;">
  <tr th:each="row : ${rows}">
    <td style="padding:6px 16px 6px 0;width:40%;vertical-align:top;font-size:13px;line-height:1.5;color:#64748b;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;" th:text="${row['label']}"></td>
    <td style="padding:6px 0;vertical-align:top;font-size:15px;line-height:1.5;color:#475569;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;" th:text="${row['value']}"></td>
  </tr>
</table>

<table th:fragment="code(value)" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td align="center" style="padding:4px 0 24px;">
      <div style="display:inline-block;background-color:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:14px 28px;font-family:ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;font-size:28px;font-weight:700;letter-spacing:6px;line-height:1.2;color:#14532d;" th:text="${value}"></div>
    </td>
  </tr>
</table>

<table th:fragment="button(href, label)" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td align="center" style="padding:12px 0 28px;">
      <a th:href="${href}" style="display:inline-block;background-color:#15803d;color:#ffffff;text-decoration:none;font-size:15px;font-weight:600;line-height:1.2;padding:13px 32px;border-radius:8px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;" th:text="${label}"></a>
    </td>
  </tr>
</table>

<table th:fragment="notes(content)" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <td style="border-top:1px solid #e2e8f0;padding-top:20px;">
      <th:block th:replace="${content}"></th:block>
    </td>
  </tr>
</table>

<p th:fragment="note(text)" style="margin:0 0 10px;font-size:13px;line-height:1.5;color:#64748b;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;" th:text="${text}"></p>

<p th:fragment="fallbackLink(href)" style="margin:0;font-size:12px;line-height:1.5;color:#64748b;word-break:break-all;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">Se il pulsante non funziona, copia questo link nel browser:<br><a th:href="${href}" style="color:#15803d;text-decoration:underline;" th:text="${href}"></a></p>

</body>
</html>
