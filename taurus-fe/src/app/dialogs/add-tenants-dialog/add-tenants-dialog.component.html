<app-dialog-shell
    title="Nuova istanza"
    subtitle="Configura l’organizzazione e i suoi limiti iniziali."
    confirmLabel="Crea istanza"
    [invalidCount]="(!tenant.name?.trim() ? 1 : 0) + (!tenant.code?.trim() ? 1 : 0)"
    (cancel)="cancel()"
    (confirm)="save()"
>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <app-form-field label="Nome" forId="name" required [error]="tenant.name?.trim() ? undefined : 'Inserisci il nome dell’istanza.'"><input pInputText id="name" [(ngModel)]="tenant.name" /></app-form-field>
        <app-form-field label="Codice" forId="code" required [error]="tenant.code?.trim() ? undefined : 'Inserisci un codice.'"><input pInputText id="code" [(ngModel)]="tenant.code" /></app-form-field>
        <app-form-field label="Email" forId="email"><input pInputText id="email" type="email" [(ngModel)]="tenant.email" /></app-form-field>
        <app-form-field label="Dominio" forId="domain"><input pInputText id="domain" [(ngModel)]="tenant.domain" /></app-form-field>
        <app-form-field label="Numero massimo utenti" forId="maxUsers"><input pInputText id="maxUsers" type="number" [min]="-1" [(ngModel)]="tenant.maxUsers" /></app-form-field>
        <app-form-field label="Data di scadenza" forId="expireDate"><p-datepicker inputId="expireDate" dateFormat="yy-mm-dd" [showIcon]="true" [(ngModel)]="tenant.expireDate" /></app-form-field>
        <app-form-field label="Stato"><p-togglebutton [(ngModel)]="tenant.active" onLabel="Abilitata" offLabel="Disabilitata" /></app-form-field>
        <app-form-field class="md:col-span-2" label="Descrizione" forId="description"><textarea pTextarea id="description" rows="5" class="w-full" [(ngModel)]="tenant.description"></textarea></app-form-field>
    </div>
</app-dialog-shell>
