<app-page-header title="Documenti legali" [subtitle]="documents.length + (documents.length === 1 ? ' documento' : ' documenti')"
    ><div pageActions><p-button label="Nuovo documento" icon="pi pi-plus" (onClick)="addDocument()" /></div
></app-page-header>

<app-inline-alert severity="info" title="Versioni immutabili" detail="I documenti già accettati non possono essere modificati. Per aggiornare il contenuto crea una nuova versione e impostala come attiva." />

<app-list-toolbar [search]="searchTerm" searchPlaceholder="Cerca documento…" [showLayout]="false" (searchChange)="onSearchChange($event)" />

<div class="card !p-0 overflow-hidden">
    <p-table
        #documentTable
        [value]="documents"
        [globalFilterFields]="['title', 'version', 'documentType']"
        [loading]="loading"
        [rowHover]="true"
        [paginator]="true"
        [rows]="12"
        [rowsPerPageOptions]="[12, 24, 48]"
        paginatorDropdownAppendTo="body"
        [showCurrentPageReport]="true"
        currentPageReportTemplate="Da {first} a {last} di {totalRecords} elementi"
        responsiveLayout="scroll"
    >
        <ng-template #header>
            <tr>
                <th scope="col">Documento</th>
                <th scope="col">Versione</th>
                <th scope="col">Pubblicazione</th>
                <th scope="col">Conferma</th>
                <th scope="col">Obbligatorio</th>
                <th scope="col">Stato</th>
                <th scope="col" class="w-24"></th>
            </tr>
        </ng-template>
        <ng-template #body let-document>
            <tr>
                <td>
                    <div class="font-semibold">{{ document.title }}</div>
                    <div class="text-sm text-surface-500 mt-1">{{ typeLabel(document.documentType) }}</div>
                    <a class="document-link" [href]="document.url" target="_blank" rel="noopener noreferrer"> {{ document.url }} <i class="pi pi-external-link"></i> </a>
                </td>
                <td>{{ document.version }}</td>
                <td>{{ document.publishedAt | date: 'dd/MM/yyyy HH:mm' }}</td>
                <td>{{ actionLabel(document.action) }}</td>
                <td>
                    <p-tag [value]="document.required ? 'Sì' : 'No'" [severity]="document.required ? 'info' : 'secondary'" />
                </td>
                <td>
                    <p-tag [value]="document.active ? 'Attivo' : 'Non attivo'" [severity]="document.active ? 'success' : 'secondary'" />
                </td>
                <td class="text-right">
                    <p-button icon="pi pi-pencil" [rounded]="true" [text]="true" pTooltip="Modifica" (onClick)="editDocument(document)" />
                </td>
            </tr>
        </ng-template>
        <ng-template #emptymessage>
            <tr>
                <td colspan="7">
                    <app-empty-state
                        icon="pi pi-file"
                        [title]="searchTerm ? 'Nessun risultato' : 'Nessun documento'"
                        [message]="searchTerm ? 'Prova a modificare o azzerare la ricerca.' : 'Pubblica il primo documento legale per iniziare.'"
                        [actionLabel]="searchTerm ? 'Azzera ricerca' : 'Nuovo documento'"
                        (action)="searchTerm ? onSearchChange('') : addDocument()"
                    />
                </td>
            </tr>
        </ng-template>
    </p-table>
</div>

<p-dialog [(visible)]="dialogVisible" [modal]="true" [draggable]="false" [closable]="false" [showHeader]="false" [style]="{ width: '48rem' }" [breakpoints]="{ '960px': '75vw', '640px': '94vw' }">
    <app-dialog-shell
        [title]="editingDocument.id ? 'Modifica documento' : 'Nuovo documento'"
        subtitle="Pubblica la versione legale che gli utenti dovranno consultare."
        [confirmLabel]="editingDocument.id ? 'Salva documento' : 'Crea documento'"
        [saving]="saving"
        [invalidCount]="isValid ? 0 : 1"
        (cancel)="dialogVisible = false"
        (confirm)="saveDocument()"
    >
        <p-fluid class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <app-form-field label="Tipo documento" forId="documentType" required>
                <p-select inputId="documentType" [options]="documentTypes" optionLabel="label" optionValue="value" [(ngModel)]="editingDocument.documentType" (ngModelChange)="documentTypeChanged($event)" appendTo="body" />
            </app-form-field>
            <app-form-field label="Versione" forId="version" required [error]="editingDocument.version.trim() ? undefined : 'Indica la versione del documento.'">
                <input pInputText id="version" [(ngModel)]="editingDocument.version" autocomplete="off" />
            </app-form-field>
            <app-form-field class="md:col-span-2" label="Titolo" forId="title" required [error]="editingDocument.title.trim() ? undefined : 'Indica il titolo del documento.'">
                <input pInputText id="title" [(ngModel)]="editingDocument.title" autocomplete="off" />
            </app-form-field>
            <app-form-field class="md:col-span-2" label="URL pubblico del documento" forId="url" required [error]="editingDocument.url.trim() ? undefined : 'Indica l’URL pubblico del documento.'">
                <input pInputText id="url" type="url" [(ngModel)]="editingDocument.url" autocomplete="off" />
            </app-form-field>
            <app-form-field label="Modalità di conferma" forId="action">
                <p-select inputId="action" [options]="actions" optionLabel="label" optionValue="value" [(ngModel)]="editingDocument.action" appendTo="body" />
            </app-form-field>
            <app-form-field label="Data di pubblicazione" forId="publishedAt">
                <p-datepicker inputId="publishedAt" [(ngModel)]="publishedAt" [showIcon]="true" [showTime]="true" hourFormat="24" dateFormat="dd/mm/yy" appendTo="body" />
            </app-form-field>
            <div class="md:col-span-2 flex flex-col sm:flex-row gap-3">
                <p-togglebutton [(ngModel)]="editingDocument.required" onLabel="Obbligatorio" offLabel="Facoltativo" onIcon="pi pi-lock" offIcon="pi pi-lock-open" />
                <p-togglebutton [(ngModel)]="editingDocument.active" onLabel="Versione attiva" offLabel="Versione non attiva" onIcon="pi pi-check-circle" offIcon="pi pi-circle" />
            </div>
        </p-fluid>
    </app-dialog-shell>
</p-dialog>
