<section class="card detail-section" [attr.aria-labelledby]="titleId">
    <header>
        <div>
            <div class="detail-section__title">
                <h2 [id]="titleId">{{ title }}</h2>
                @if (count !== undefined) {
                    <span>{{ count }}</span>
                }
                @if (dirty) {
                    <p-tag severity="warn" value="Da salvare" />
                }
            </div>
            @if (description) {
                <p>{{ description }}</p>
            }
        </div>
        <div class="detail-section__actions">
            @if (actionLabel && actionLink) {
                <a class="detail-section__link" [routerLink]="actionLink" [queryParams]="actionQueryParams">{{ actionLabel }} <i class="pi pi-arrow-right" aria-hidden="true"></i></a>
            }
            <ng-content select="[sectionActions]" />
        </div>
    </header>
    <div class="detail-section__content"><ng-content /></div>
</section>
