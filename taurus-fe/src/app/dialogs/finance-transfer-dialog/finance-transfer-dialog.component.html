<app-dialog-shell #shell heading="Trasferimento tra conti"
    subtitle="Genera due scritture coerenti: un'uscita dal conto di origine e un'entrata su quello di destinazione."
    confirmLabel="Registra trasferimento" [invalidCount]="invalidCount" (cancel)="cancel()" (confirm)="save()">
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <app-form-field label="Conto di origine" forId="transfer-source" required
            [error]="shell.validationAttempted ? sourceError : undefined">
            <p-select inputId="transfer-source" [(ngModel)]="transfer.sourceAccountId" [options]="accounts"
                optionLabel="name" optionValue="id" placeholder="Seleziona" />
        </app-form-field>
        <app-form-field label="Conto di destinazione" forId="transfer-destination" required
            [error]="shell.validationAttempted ? destinationError : undefined">
            <p-select inputId="transfer-destination" [(ngModel)]="transfer.destinationAccountId" [options]="accounts"
                optionLabel="name" optionValue="id" placeholder="Seleziona" />
        </app-form-field>
        <app-form-field label="Data contabile" forId="transfer-date" required>
            <p-datepicker inputId="transfer-date" [(ngModel)]="bookingDate" dateFormat="dd/mm/yy" appendTo="body" />
        </app-form-field>
        <app-form-field label="Data valuta" forId="transfer-value-date">
            <p-datepicker inputId="transfer-value-date" [(ngModel)]="valueDate" dateFormat="dd/mm/yy" [showClear]="true"
                appendTo="body" />
        </app-form-field>
        <app-form-field class="md:col-span-2" label="Importo" forId="transfer-amount" required
            [error]="shell.validationAttempted ? amountError : undefined">
            <p-inputnumber inputId="transfer-amount" [(ngModel)]="transfer.amount" mode="currency" currency="EUR"
                locale="it-IT" [min]="0" />
        </app-form-field>
        <app-form-field class="md:col-span-2" label="Descrizione" forId="transfer-description" required
            [error]="shell.validationAttempted ? descriptionError : undefined">
            <input id="transfer-description" pInputText [(ngModel)]="transfer.description" />
        </app-form-field>
        <app-form-field class="md:col-span-2" label="Note" forId="transfer-notes">
            <textarea id="transfer-notes" pTextarea rows="3" [(ngModel)]="transfer.notes"></textarea>
        </app-form-field>
    </div>
</app-dialog-shell>
